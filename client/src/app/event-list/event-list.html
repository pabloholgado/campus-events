<app-event-summary [events]="events()" />
<input
  type="search"
  placeholder="Search events..."
  [value]="search()"
  (input)="search.set($any($event.target).value)"
/>

<select
  [value]="sortBy()"
  (change)="sortBy.set($any($event.target).value)"
>
  <option value="date">By date</option>
  <option value="title">By title</option>
</select>

<p class="count">{{ visibleEvents().length }} of {{ events().length }} events</p>

<p class="note">{{ favourites().length }} favourites</p>


<h2>Upcoming</h2>
<div class="grid">
  @for (event of upcomingEvents(); track event.id) {
    <app-event-card
  [event]="event"
  [favourite]="favourites().includes(event.id)"
  (interested)="onInterested($event)"
     />
  } @empty {
    <p>No upcoming events.</p>
  }
</div>

@if (pastEvents().length > 0) {
  <h2>Past</h2>
  <div class="grid">
    @for (event of pastEvents(); track event.id) {
      <app-event-card
  [event]="event"
  [favourite]="favourites().includes(event.id)"
  (interested)="onInterested($event)"
      />
    }
  </div>
}
